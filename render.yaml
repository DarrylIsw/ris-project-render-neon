services:
  - type: web
    name: ris-project-render-neon
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: FILE_STORAGE_BACKEND
        value: s3
      - key: FILE_STORAGE_BUCKET
        value: ris-testing-files
      - key: EMAIL_ENABLED
        value: "false"
      - key: EMAIL_ALLOW_DIRECT_DELIVERY
        value: "false"
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        value: https://br-royal-sun-b3wp1lci.storage.c-4.ap-southeast-1.aws.neon.tech
      - key: AWS_REGION
        value: ap-southeast-1
      - key: MFA_ENCRYPTION_KEY
        sync: false
